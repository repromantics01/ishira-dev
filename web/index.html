<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PawsMatch - Connecting pets with their forever homes">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pawsmatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PawsMatch</title>
  <link rel="manifest" href="manifest.json">

  <!-- EmailJS SDK with proper initialization -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      console.log("Initializing EmailJS...");
      emailjs.init("dSAmVPjE9iRFgTq8z");
      console.log("EmailJS initialized successfully");
    });
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>

  <script>
    window.firebaseConfig = {
      apiKey: "%FIREBASE_API_KEY%",
      appId: "%FIREBASE_APP_ID_WEB%",
      messagingSenderId: "%FIREBASE_MESSAGING_SENDER_ID%",
      projectId: "%FIREBASE_PROJECT_ID%",
      authDomain: "%FIREBASE_AUTH_DOMAIN%",
      databaseURL: "%FIREBASE_DATABASE_URL%",
      storageBucket: "%FIREBASE_STORAGE_BUCKET%",
      measurementId: "%FIREBASE_MEASUREMENT_ID%"
    };
    window.supabaseConfig = {
      url: "%SUPABASE_URL%",
      key: "%SUPABASE_KEY%"
    };
    
    // Don't initialize Firebase here - let Flutter handle it
    // if (typeof firebase !== 'undefined') {
    //   firebase.initializeApp(window.firebaseConfig);
    // }
  </script>
</head>
<body>
  <!-- Add debug log for EmailJS errors -->
  <script>
    window.addEventListener('error', function(event) {
      console.log('Global error caught:', event.error);
    });
  </script>
  
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
